x-api-common: &api-common
  build:
    context: .
    dockerfile: Dockerfile
  image: python_hexagonal_fastapi-api:latest
  env_file:
    - .env.test
  environment:
    ENV: test
    DATABASE_URL: postgresql+asyncpg://admin:admin@db:5432/curso_python
    REDIS_URL: redis://redis:6379/0
  cpus: 1.0
  mem_limit: 1g
  healthcheck:
    test:
      [
        "CMD",
        "python",
        "-c",
        "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=3)",
      ]
    interval: 5s
    timeout: 5s
    retries: 24
    start_period: 30s
  volumes:
    - .:/app
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  api_1:
    <<: *api-common
    container_name: fastapi_app_1

  api_2:
    <<: *api-common
    container_name: fastapi_app_2

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx_lb
    pull_policy: if_not_present
    ports:
      - "8000:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api_1:
        condition: service_healthy
      api_2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/docs >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  db:
    image: postgres:15-alpine
    container_name: postgres_db
    pull_policy: if_not_present
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: curso_python
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d curso_python"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: redis_cache
    pull_policy: if_not_present
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
  redis_data:
